name: Build RunPod LTX serverless worker image

# Builds and pushes deploy/runpod_serverless/Dockerfile so a Serverless
# endpoint's imageName/template can point at it without anyone needing
# Docker installed locally — the training image workflow
# (build-training-image.yml) is the exact same pattern for the LoRA
# training image. After the first run, go to the repo's GitHub Packages
# page → Package settings → change visibility to Public — GITHUB_TOKEN-
# pushed packages default to private regardless of the repo's own
# visibility, and RunPod needs a public image (no registry credentials
# are passed to imageName).

on:
  push:
    branches: [main]
    paths:
      - "deploy/runpod_serverless/**"
      - ".github/workflows/build-ltx-serverless-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod_serverless/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/culturix-ltx-serverless:latest
