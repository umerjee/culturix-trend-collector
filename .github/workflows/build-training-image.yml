name: Build RunPod training image

# Builds and pushes deploy/runpod_training/Dockerfile so RUNPOD_TRAINING_IMAGE
# can point at it without anyone needing Docker installed locally —
# create_training_pod() (app/media/runpod_client.py) passes imageName with no
# registry credentials, so this must be a PUBLIC image. After the first run,
# go to the repo's GitHub Packages page (right sidebar → Packages, or
# https://github.com/<owner>/<repo>/pkgs/container/culturix-ltx-training) →
# Package settings → change visibility to Public — GITHUB_TOKEN-pushed
# packages default to private regardless of the repo's own visibility.

on:
  push:
    branches: [main]
    paths:
      - "deploy/runpod_training/**"
      - ".github/workflows/build-training-image.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod_training/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/culturix-ltx-training:latest
