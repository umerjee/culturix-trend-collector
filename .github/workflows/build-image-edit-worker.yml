name: Build RunPod image-edit worker

# Builds and pushes deploy/runpod_serverless_image/Dockerfile so a RunPod
# Serverless endpoint can point at it without anyone needing Docker
# installed locally. Mirrors build-training-image.yml. Must be PUBLIC —
# RunPod's endpoint/template creation passes imageName with no registry
# credentials. After the first run, go to the repo's GitHub Packages page
# (https://github.com/<owner>/<repo>/pkgs/container/culturix-image-edit-worker)
# -> Package settings -> change visibility to Public.

on:
  push:
    branches: [main]
    paths:
      - "deploy/runpod_serverless_image/**"
      - ".github/workflows/build-image-edit-worker.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod_serverless_image/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/culturix-image-edit-worker:latest
