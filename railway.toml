[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
# Measured live 2026-08-19: real startup (the lifespan()-run ALTER TABLE
# migration list, now dozens of statements accumulated over the project's
# life, each a real round-trip to the Supabase-hosted Postgres) takes
# 133s end to end. The prior 30s value meant EVERY deploy was failing its
# health check regardless of whether the actual code changed anything —
# confirmed by running the exact lifespan() the container runs against the
# real database directly and timing it. 300s leaves real margin above the
# measured figure rather than just clearing it exactly.
# Raised from 300 after a deploy failed its health check on 2026-09-02,
# exhausting the window with "service unavailable" on all 11 attempts. The
# 133s figure above is a MEASUREMENT, not a bound: those 118 DDL statements
# each cost a round trip plus a commit, so startup scales directly with
# whatever latency the Supabase-hosted Postgres happens to have that day.
# 300s left under 2.2x headroom over a number that already moves.
#
# This is a floor, not a fix. The real fix is to stop issuing 118 DDL
# statements on every single boot — read information_schema once and run
# only the statements that are actually missing, which would make a steady-
# state start near-instant. See the note in app/main.py's lifespan().
healthcheckTimeout = 600
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# ── Scheduling note ────────────────────────────────────────────────────────
# Do NOT create separate Railway Cron Services for collection/clustering/
# pipeline/digests. app/scheduler.py already runs all of this in-process
# inside this same web service (started from app/main.py's lifespan()):
# collection 4x/day, the full LangGraph pipeline daily, Content Check daily,
# plus post-metrics-refresh and auto-publish. A prior version of this file
# instructed setting up 4 additional Cron Services that duplicated this
# exact work — confirmed to have doubled real LLM API costs (DeepSeek/Qwen/
# Claude/Voyage) by running the whole pipeline twice a day. Removed.
